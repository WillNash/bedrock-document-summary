name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # ── Python tests ─────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: pip install pytest boto3 jinja2 jsonschema numpy scikit-learn

      - name: Install CPU-only torch (prevents 2-3 GB CUDA wheel on ubuntu-latest)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install similarity test dependencies
        run: pip install "sentence-transformers>=6.1.0" "bert-score==0.3.13"

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-models-all-minilm-v2

      - name: Run tests
        run: pytest tests/ -v -m "not slow"

  # ── Terraform plan (main branch only) ────────────────────────────────────────
  plan:
    name: Terraform Plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION:    us-east-1
      TF_VAR_project_name:   bedrock-doc-summary

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.6"

      - name: Write backend config
        env:
          TF_BACKEND_CONFIG: ${{ secrets.TF_BACKEND_CONFIG }}
        run: echo "$TF_BACKEND_CONFIG" > infra/backend.hcl

      - name: Build Lambda layer
        run: ./scripts/build_lambdas.sh

      - name: Terraform Init
        run: terraform -chdir=infra init -backend-config=backend.hcl -input=false

      - name: Terraform Format Check
        run: terraform -chdir=infra fmt -check -recursive

      - name: Terraform Validate
        run: terraform -chdir=infra validate

      - name: Terraform Plan
        run: terraform -chdir=infra plan -input=false
