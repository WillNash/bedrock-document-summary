name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    environment: production  # enables GitHub environment protection rules
    permissions:
      contents: read
      id-token: write  # required for GitHub Actions cache write
    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION:    us-east-1
      TF_VAR_project_name:   bedrock-doc-summary

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.6"

      - name: Write backend config
        env:
          TF_BACKEND_CONFIG: ${{ secrets.TF_BACKEND_CONFIG }}
        run: echo "$TF_BACKEND_CONFIG" > infra/backend.hcl

      - name: Build Lambda layer
        run: ./scripts/build_lambdas.sh

      - name: Terraform Init
        run: terraform -chdir=infra init -backend-config=backend.hcl -input=false

      - name: Remove guardrail from state
        # The AWS provider has a bug causing aws_bedrock_guardrail to perpetually
        # destroy/recreate, so it was moved out of Terraform and into ensure_guardrail.sh.
        # These lines evict it from state on deployments that still have it; they are
        # silent no-ops on clean state.
        run: |
          terraform -chdir=infra state rm aws_bedrock_guardrail.main 2>/dev/null || true
          terraform -chdir=infra state rm aws_bedrock_guardrail_version.main 2>/dev/null || true

      - name: Ensure Bedrock guardrail
        run: ./scripts/ensure_guardrail.sh >> $GITHUB_ENV

      - name: Create ECR repositories
        # Must exist before image pushes and before Lambdas can be created.
        # On subsequent deploys this is a fast no-op.
        run: |
          terraform -chdir=infra apply -auto-approve -input=false \
            -target=aws_ecr_repository.gold_comparator \
            -target=aws_ecr_lifecycle_policy.gold_comparator \
            -target=aws_ecr_repository.gold_scorer \
            -target=aws_ecr_lifecycle_policy.gold_scorer

      - name: Set up QEMU (required for arm64 image build on x86 runner)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker images
        run: |
          ./scripts/build_gold_comparator.sh
          ./scripts/build_gold_scorer.sh

      - name: Terraform Apply
        run: terraform -chdir=infra apply -auto-approve -input=false

      - name: Pin Docker Lambdas to latest image
        # On first deploy the Lambdas were just created pointing to :latest — this pins
        # them to the specific digest pushed above. On subsequent deploys it updates the
        # running function to the new image (Terraform ignores image_uri changes).
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)

          pin_lambda() {
            local output_name="$1"
            local repo_output="$2"
            local FUNCTION_NAME
            FUNCTION_NAME=$(terraform -chdir=infra output -raw "$output_name" 2>/dev/null || true)
            if [[ ! "$FUNCTION_NAME" =~ ^[a-zA-Z0-9_-]+$ ]]; then
              echo "INFO: $output_name not yet deployed or output unavailable, skipping."
              return
            fi
            local REPO
            REPO=$(terraform -chdir=infra output -raw "$repo_output" 2>/dev/null || true)
            aws lambda wait function-updated \
              --function-name "$FUNCTION_NAME" \
              --region "${AWS_DEFAULT_REGION}"
            aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --image-uri "${ACCOUNT}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${REPO}:latest" \
              --region "${AWS_DEFAULT_REGION}"
          }

          pin_lambda gold_comparator_function_name gold_comparator_ecr_repository_name
          pin_lambda gold_scorer_function_name gold_scorer_ecr_repository_name

      - name: Deploy frontend
        run: ./scripts/deploy_frontend.sh
