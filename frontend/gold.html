<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gold Standard Test — Document Summarizer</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
  <div id="app" style="max-width: 760px;">
    <div class="card">
      <h1>Gold Standard Test</h1>

      <div id="auth-section" class="hidden">
        <p>Sign in to run a gold standard accuracy test.</p>
        <button id="signin-btn" class="btn-primary">Sign In</button>
      </div>

      <div id="test-section" class="hidden">
        <div class="config-row">
          <div class="file-area">
            <label class="btn-secondary" for="file-input">Choose Document</label>
            <input type="file" id="file-input" class="hidden" accept=".txt,.md,.csv,.pdf" />
            <span id="file-name" class="file-name">No file selected</span>
          </div>
          <div class="run-config">
            <label for="run-count">Runs</label>
            <input type="number" id="run-count" min="1" max="200" value="3" />
          </div>
          <button id="run-btn" class="btn-primary" disabled>Run Test</button>
        </div>

        <div class="config-row">
          <div class="file-area">
            <label class="btn-secondary" for="ref-input">Choose Reference</label>
            <input type="file" id="ref-input" class="hidden" accept=".txt,.md" />
            <span id="ref-name" class="file-name">No reference selected</span>
          </div>
        </div>

        <div id="progress-panel" class="hidden">
          <p id="progress-header" class="progress-header"></p>
          <div id="run-grid" class="run-grid"></div>
          <div id="error-log" class="hidden"></div>
        </div>

        <div id="comparison-panel" class="hidden">
          <div class="comparison-header">
            <h2>Accuracy Results</h2>
            <span id="comparison-run-count" class="comparison-subhead"></span>
          </div>
          <div id="comparison-metrics" class="comparison-metrics"></div>
          <div class="comparison-matrix-heading">Per-Run Scores</div>
          <div id="score-table" class="matrix-scroll"></div>
        </div>

        <div class="signout-row">
          <a href="test.html" class="btn-link">Consistency Test</a>
          <button id="signout-btn" class="btn-link">Sign Out</button>
        </div>
      </div>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="gold.js"></script>
</body>
</html>
